<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    header h1 a {
      color: var(--text);
      text-decoration: none;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    nav {
      margin-top: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    nav a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.875rem;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    nav a:hover {
      color: var(--accent-hover);
      border-color: var(--accent);
    }

    .container {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 2rem;
    }

    .content h1, .content h2, .content h3, .content h4 {
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }

    .content h1 { font-size: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    .content h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
    .content h3 { font-size: 1.25rem; }

    .content p { margin-bottom: 1rem; }

    .content a { color: var(--accent); text-decoration: none; }
    .content a:hover { text-decoration: underline; }

    .content ul, .content ol {
      margin-bottom: 1rem;
      padding-left: 2rem;
    }

    .content li { margin-bottom: 0.25rem; }

    .content table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1rem;
    }

    .content th, .content td {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      text-align: left;
    }

    .content th {
      background: var(--surface);
      font-weight: 600;
    }

    .content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      margin: 1rem 0;
      color: var(--text-muted);
    }

    .content code {
      background: var(--surface);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      font-size: 0.9em;
    }

    .content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    .content strong { font-weight: 600; }
    .content em { font-style: italic; }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
      margin-top: 3rem;
    }

    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
    <p>{{ site.description }}</p>
    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/foundational/SEEME' | relative_url }}">Declaration</a>
      <a href="{{ '/framework/PRINCIPLES' | relative_url }}">Principles</a>
      <a href="{{ '/framework/METHODOLOGY' | relative_url }}">Methodology</a>
      <a href="{{ '/framework/CONNECTIONS' | relative_url }}">Connections</a>
      <a href="{{ '/meta/glossary' | relative_url }}">Glossary</a>
    </nav>
  </header>

  <div class="container">
    <div class="content">
      {{ content }}
    </div>
  </div>

  <footer>
    Built by <a href="https://github.com/EvangAI-777">EvangAI-777</a> |
    Licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>
  </footer>
</body>
</html>
